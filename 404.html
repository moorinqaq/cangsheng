<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>此路不通 · 苍生之下</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .err{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 20px}
  .err .big{font-family:var(--display);font-size:clamp(88px,16vw,180px);line-height:.9;letter-spacing:.08em;
    color:rgba(200,162,74,.16);margin:0 0 18px}
  .err h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,40px);letter-spacing:.3em;
    margin:0 0 16px;color:var(--paper)}
  .err p{font-size:15px;letter-spacing:.14em;color:var(--muted);line-height:2.1;margin:0 0 10px}
  .err .couplet{font-family:var(--display);font-size:17px;letter-spacing:.22em;color:var(--gold);
    margin:30px 0 40px;opacity:.85}
  .err a.back{display:inline-block;border:1px solid rgba(200,162,74,.4);padding:12px 30px;border-radius:999px;
    font-size:14px;letter-spacing:.24em;color:var(--gold);transition:.35s}
  .err a.back:hover{background:rgba(200,162,74,.14);border-color:var(--gold)}
  .err .path{margin-top:34px;font-size:12px;letter-spacing:.1em;color:#5c5348;word-break:break-all}
</style>
</head>
<body>
<main class="err">
  <div>
    <div class="big">无</div>
    <h1>此 路 不 通</h1>
    <p>你要找的这一页，不在苍生界里。</p>
    <p>井底没有它，六脉也没有它。</p>
    <div class="couplet">井底有光封未启，人间无梦不曾收。</div>
    <a class="back" href="/">回 到 首 页</a>
    <div class="path" id="path"></div>
  </div>
</main>
<script>
  document.getElementById('path').textContent = location.pathname;
</script>
</body>
</html>
